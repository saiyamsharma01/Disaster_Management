name: sahaaya
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  lottie: ^3.3.2
  go_router: ^16.2.2
  google_maps_flutter: ^2.5.0
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  device_preview: ^1.3.1
  lucide_icons: ^0.257.0
  flutter_map: ^6.2.1
  latlong2: ^0.9.1
  font_awesome_flutter: ^10.7.0
  mapbox_maps_flutter: ^2.0.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3


  # Firebase
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  firebase_auth_web: ^6.0.3
  google_sign_in: 7.2.0
  cloud_firestore: ^6.0.2

  # AI & Chat
  google_generative_ai: ^0.4.7
  http: ^1.2.2
  google_sign_in_android: 7.2.2
  google_sign_in_ios: 6.2.1
  google_sign_in_platform_interface: 3.1.0
  google_sign_in_web: 1.1.0

  # Notifications
  flutter_local_notifications: ^17.2.3
  firebase_messaging: ^16.0.3
  googleapis_auth: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/lotties/
    - assets/images/
  generate: true
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/sahaaya_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/sahaaya_logo.png"
